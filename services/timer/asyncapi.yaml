# ABOUTME: Описывает публичные NATS маршруты и owner-схемы таймера.
# ABOUTME: Авторизованные команды и события v2 сохраняют неизменного владельца.
asyncapi: 3.1.0
info:
  title: Brai timer service
  version: 2.0.0
  description: Wire contract v2 for the durable timer command/event streams and brai_timer NATS Service. NATS Service
    name brai_timer, service version 2.0.0, generated instance ID; PING, INFO and STATS are provided. Query replies
    use the request replyTo inbox. Service errors use Nats-Service-Error and Nats-Service-Error-Code headers. Every command, query, event and successful reply requires userId supplied by trusted web after session validation. The accepted owner is immutable across logout and redelivery. All records and cursors are owner scoped; v1 subjects are disabled. Messages without valid owner are terminated without effect or event.
servers:
  brai:
    host: '{host}:{port}'
    protocol: nats
    description: Private NATS endpoint supplied by runtime configuration.
    variables:
      host:
        default: localhost
      port:
        default: '4222'
defaultContentType: application/json
channels:
  startCommand:
    address: brai.timer.v2.command.start
    messages:
      StartCommand:
        $ref: '#/components/messages/StartCommand'
  stopCommand:
    address: brai.timer.v2.command.stop
    messages:
      StopCommand:
        $ref: '#/components/messages/StopCommand'
  editCommand:
    address: brai.timer.v2.command.edit
    messages:
      EditCommand:
        $ref: '#/components/messages/EditCommand'
  deleteCommand:
    address: brai.timer.v2.command.delete
    messages:
      DeleteCommand:
        $ref: '#/components/messages/DeleteCommand'
  startedEvent:
    address: brai.timer.v2.event.started
    messages:
      StartedEvent:
        $ref: '#/components/messages/StartedEvent'
  stoppedEvent:
    address: brai.timer.v2.event.stopped
    messages:
      StoppedEvent:
        $ref: '#/components/messages/StoppedEvent'
  editedEvent:
    address: brai.timer.v2.event.edited
    messages:
      TimerEditedEvent:
        $ref: '#/components/messages/TimerEditedEvent'
  deletedEvent:
    address: brai.timer.v2.event.deleted
    messages:
      TimerDeletedEvent:
        $ref: '#/components/messages/TimerDeletedEvent'
  rejectedEvent:
    address: brai.timer.v2.event.rejected
    messages:
      RejectedEvent:
        $ref: '#/components/messages/RejectedEvent'
  snapshotQuery:
    address: brai.timer.v2.query.snapshot
    messages:
      SnapshotRequest:
        $ref: '#/components/messages/SnapshotRequest'
      SnapshotResponse:
        $ref: '#/components/messages/SnapshotResponse'
  historyQuery:
    address: brai.timer.v2.query.history
    messages:
      HistoryRequest:
        $ref: '#/components/messages/HistoryRequest'
      HistoryResponse:
        $ref: '#/components/messages/HistoryResponse'
  commandQuery:
    address: brai.timer.v2.query.command
    messages:
      CommandLookupRequest:
        $ref: '#/components/messages/CommandLookupRequest'
      CommandLookupResponse:
        $ref: '#/components/messages/CommandLookupResponse'
  statisticsQuery:
    address: brai.timer.v2.query.statistics
    messages:
      StatisticsRequest:
        $ref: '#/components/messages/StatisticsRequest'
      StatisticsResponse:
        $ref: '#/components/messages/StatisticsResponse'
  serviceReply:
    address: null
    messages:
      SnapshotResponse:
        $ref: '#/components/messages/SnapshotResponse'
      HistoryResponse:
        $ref: '#/components/messages/HistoryResponse'
      CommandLookupResponse:
        $ref: '#/components/messages/CommandLookupResponse'
      StatisticsResponse:
        $ref: '#/components/messages/StatisticsResponse'
      ServiceError:
        $ref: '#/components/messages/ServiceError'
operations:
  acceptStart:
    action: receive
    channel:
      $ref: '#/channels/startCommand'
    messages:
    - $ref: '#/channels/startCommand/messages/StartCommand'
    description: Durable immutable intention with client timerId and canonical UTC millisecond timestamp;
      authenticated expectedVersion command remains supported. Persist state and result, publish the saved event,
      wait for PubAck before ACK. New intentions do not require the preceding owner version.
  acceptStop:
    action: receive
    channel:
      $ref: '#/channels/stopCommand'
    messages:
    - $ref: '#/channels/stopCommand/messages/StopCommand'
    description: Durable immutable intention with client timerId and canonical UTC millisecond timestamp;
      authenticated expectedVersion command remains supported. Persist state and result, publish the saved event,
      wait for PubAck before ACK. New intentions do not require the preceding owner version.
  acceptEdit:
    action: receive
    channel:
      $ref: '#/channels/editCommand'
    messages:
    - $ref: '#/channels/editCommand/messages/EditCommand'
    description: Owner-version CAS against a completed interval. Both UTC millisecond boundaries are absolute; the
      service derives duration, rejects overlap with another completed interval or the active interval, atomically
      saves the projection and immutable command result, publishes TimerEditedEvent, waits for PubAck, then ACKs.
  acceptDelete:
    action: receive
    channel:
      $ref: '#/channels/deleteCommand'
    messages:
    - $ref: '#/channels/deleteCommand/messages/DeleteCommand'
    description: Owner-version CAS that soft-deletes a completed interval from history and totals while retaining the
      immutable command ledger. Persist the result, publish TimerDeletedEvent, wait for PubAck, then ACK.
  publishStarted:
    action: send
    channel:
      $ref: '#/channels/startedEvent'
    messages:
    - $ref: '#/channels/startedEvent/messages/StartedEvent'
  publishStopped:
    action: send
    channel:
      $ref: '#/channels/stoppedEvent'
    messages:
    - $ref: '#/channels/stoppedEvent/messages/StoppedEvent'
  publishEdited:
    action: send
    channel:
      $ref: '#/channels/editedEvent'
    messages:
    - $ref: '#/channels/editedEvent/messages/TimerEditedEvent'
  publishDeleted:
    action: send
    channel:
      $ref: '#/channels/deletedEvent'
    messages:
    - $ref: '#/channels/deletedEvent/messages/TimerDeletedEvent'
  publishRejected:
    action: send
    channel:
      $ref: '#/channels/rejectedEvent'
    messages:
    - $ref: '#/channels/rejectedEvent/messages/RejectedEvent'
  snapshot:
    action: receive
    channel:
      $ref: '#/channels/snapshotQuery'
    messages:
    - $ref: '#/channels/snapshotQuery/messages/SnapshotRequest'
    reply:
      address:
        location: $message.header#/replyTo
        description: Reply is sent to the request NATS message reply subject; x-nats-reply-subject maps AsyncAPI
          reply address to native NATS metadata. Clients do not set a JSON/HTTP header.
        x-nats-reply-subject: message.reply
      channel:
        $ref: '#/channels/serviceReply'
      messages:
      - $ref: '#/channels/serviceReply/messages/SnapshotResponse'
      - $ref: '#/channels/serviceReply/messages/ServiceError'
    bindings:
      nats:
        queue: brai_timer
        bindingVersion: 0.1.0
  history:
    action: receive
    channel:
      $ref: '#/channels/historyQuery'
    messages:
    - $ref: '#/channels/historyQuery/messages/HistoryRequest'
    reply:
      address:
        location: $message.header#/replyTo
        description: Reply is sent to the request NATS message reply subject; x-nats-reply-subject maps AsyncAPI
          reply address to native NATS metadata. Clients do not set a JSON/HTTP header.
        x-nats-reply-subject: message.reply
      channel:
        $ref: '#/channels/serviceReply'
      messages:
      - $ref: '#/channels/serviceReply/messages/HistoryResponse'
      - $ref: '#/channels/serviceReply/messages/ServiceError'
    bindings:
      nats:
        queue: brai_timer
        bindingVersion: 0.1.0
  commandLookup:
    action: receive
    channel:
      $ref: '#/channels/commandQuery'
    messages:
    - $ref: '#/channels/commandQuery/messages/CommandLookupRequest'
    reply:
      address:
        location: $message.header#/replyTo
        description: Reply is sent to the request NATS message reply subject; x-nats-reply-subject maps AsyncAPI
          reply address to native NATS metadata. Clients do not set a JSON/HTTP header.
        x-nats-reply-subject: message.reply
      channel:
        $ref: '#/channels/serviceReply'
      messages:
      - $ref: '#/channels/serviceReply/messages/CommandLookupResponse'
      - $ref: '#/channels/serviceReply/messages/ServiceError'
    bindings:
      nats:
        queue: brai_timer
        bindingVersion: 0.1.0
  statistics:
    action: receive
    channel:
      $ref: '#/channels/statisticsQuery'
    messages:
    - $ref: '#/channels/statisticsQuery/messages/StatisticsRequest'
    reply:
      address:
        location: $message.header#/replyTo
        description: Reply is sent to the request NATS message reply subject; x-nats-reply-subject maps AsyncAPI
          reply address to native NATS metadata. Clients do not set a JSON/HTTP header.
        x-nats-reply-subject: message.reply
      channel:
        $ref: '#/channels/serviceReply'
      messages:
      - $ref: '#/channels/serviceReply/messages/StatisticsResponse'
      - $ref: '#/channels/serviceReply/messages/ServiceError'
    bindings:
      nats:
        queue: brai_timer
        bindingVersion: 0.1.0
components:
  messages:
    StartCommand:
      name: StartCommand
      payload:
        $ref: ./schemas/commands.schema.json#/definitions/StartCommand
    StopCommand:
      name: StopCommand
      payload:
        $ref: ./schemas/commands.schema.json#/definitions/StopCommand
    EditCommand:
      name: EditCommand
      payload:
        $ref: ./schemas/commands.schema.json#/definitions/EditCommand
    DeleteCommand:
      name: DeleteCommand
      payload:
        $ref: ./schemas/commands.schema.json#/definitions/DeleteCommand
    StartedEvent:
      name: StartedEvent
      payload:
        $ref: ./schemas/messages.schema.json#/definitions/StartedEvent
    StoppedEvent:
      name: StoppedEvent
      payload:
        $ref: ./schemas/messages.schema.json#/definitions/StoppedEvent
    TimerEditedEvent:
      name: TimerEditedEvent
      payload:
        $ref: ./schemas/messages.schema.json#/definitions/TimerEditedEvent
    TimerDeletedEvent:
      name: TimerDeletedEvent
      payload:
        $ref: ./schemas/messages.schema.json#/definitions/TimerDeletedEvent
    RejectedEvent:
      name: RejectedEvent
      payload:
        $ref: ./schemas/messages.schema.json#/definitions/RejectedEvent
    SnapshotRequest:
      name: SnapshotRequest
      payload:
        $ref: ./schemas/messages.schema.json#/definitions/SnapshotRequest
    SnapshotResponse:
      name: SnapshotResponse
      payload:
        $ref: ./schemas/messages.schema.json#/definitions/SnapshotResponse
      headers:
        type: object
        additionalProperties: true
        properties:
          Nats-Service-Error:
            type: string
          Nats-Service-Error-Code:
            type: string
            enum:
            - '400'
            - '404'
            - '500'
            - '503'
    HistoryRequest:
      name: HistoryRequest
      payload:
        $ref: ./schemas/messages.schema.json#/definitions/HistoryRequest
    HistoryResponse:
      name: HistoryResponse
      payload:
        $ref: ./schemas/messages.schema.json#/definitions/HistoryResponse
      headers:
        type: object
        additionalProperties: true
        properties:
          Nats-Service-Error:
            type: string
          Nats-Service-Error-Code:
            type: string
            enum:
            - '400'
            - '404'
            - '409'
            - '500'
            - '503'
    CommandLookupRequest:
      name: CommandLookupRequest
      payload:
        $ref: ./schemas/messages.schema.json#/definitions/CommandLookupRequest
    CommandLookupResponse:
      name: CommandLookupResponse
      payload:
        $ref: ./schemas/messages.schema.json#/definitions/CommandLookupResponse
      headers:
        type: object
        additionalProperties: true
        properties:
          Nats-Service-Error:
            type: string
          Nats-Service-Error-Code:
            type: string
            enum:
            - '400'
            - '404'
            - '500'
            - '503'
    StatisticsRequest:
      name: StatisticsRequest
      payload:
        $ref: ./schemas/messages.schema.json#/definitions/StatisticsRequest
    StatisticsResponse:
      name: StatisticsResponse
      payload:
        $ref: ./schemas/messages.schema.json#/definitions/StatisticsResponse
      headers:
        type: object
        additionalProperties: true
        properties:
          Nats-Service-Error:
            type: string
          Nats-Service-Error-Code:
            type: string
            enum:
            - '400'
            - '404'
            - '409'
            - '500'
            - '503'
    ServiceError:
      name: ServiceError
      description: NATS Service error; the two error headers are required for this response.
      headers:
        type: object
        required:
        - Nats-Service-Error
        - Nats-Service-Error-Code
        properties:
          Nats-Service-Error:
            type: string
            minLength: 1
          Nats-Service-Error-Code:
            type: string
            enum:
            - '400'
            - '404'
            - '409'
            - '500'
            - '503'
      payload:
        $ref: ./schemas/common.schema.json#/definitions/error
