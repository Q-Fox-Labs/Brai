"settings.fieldDescriptions.browser.useRealProfile": "Hermes копирует профиль браузера с вашими входами, cookies и настройками и использует копию в своём Chromium. Исходный профиль напрямую не открывается; перед каждым запуском копия обновляется. По запросу агент может открыть локальный браузер даже при настроенном облачном браузере. Поддерживаются только Chrome, Edge, Brave, Brave Origin и Chromium. По умолчанию выключено."
"settings.fieldDescriptions.stt.streaming": "Показывать текст, пока вы говорите (OpenAI, xAI, ElevenLabs). При ошибке используется сохранённая запись."
"settings.fieldDescriptions.voice.gptLive.instructions": "Дополнительные указания голосовому собеседнику: тон, темп и язык. Основные инструкции Hermes сохраняются."
"settings.fieldDescriptions.voice.gptLive.voice": "Голос для GPT-Live. Можно указать идентификатор собственного голоса."
"settings.fieldDescriptions.voice.voiceChatMode": "chained: распознавание речи → Hermes → озвучивание ответа выбранными ниже сервисами. gpt-live: модель OpenAI gpt-live-1 одновременно слушает и говорит, а задания передаёт Hermes с выбранной вами моделью и всеми инструментами. Нужен ключ API OpenAI. Голосовой сервис стоит $0.05 в минуту."
