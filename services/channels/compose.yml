# ABOUTME: Запускает только самостоятельные Каналы из принятого immutable image.
# ABOUTME: Runtime не получает owner credentials; Telegram и Temporal не запускаются.
services:
  channels:
    image: ${CHANNELS_IMAGE:?}
    pull_policy: never
    command: [node, dist/main.js]
    user: "${CHANNELS_UID:?}:${CHANNELS_GID:?}"
    environment:
      CHANNELS_CONFIG: /run/channels/config.json
    volumes:
      - ${CHANNELS_RUNTIME_INPUTS:?}:/run/channels:ro
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${CHANNELS_MEMORY:-256m}
    cpus: ${CHANNELS_CPUS:-1}
    restart: unless-stopped
    networks: [private]
  migrate:
    image: ${CHANNELS_IMAGE:?}
    pull_policy: never
    command: [node, dist/migrate.js]
    profiles: [setup]
    env_file: ["${CHANNELS_OWNER_ENV:?}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [private]
networks:
  private:
    external: true
    name: ${CHANNELS_NETWORK:?}
