# ABOUTME: Запускает только самостоятельные Контакты из принятого immutable image.
# ABOUTME: Runtime не получает owner credentials; Telegram и Temporal не запускаются.
services:
  contacts:
    image: ${CONTACTS_IMAGE:?}
    pull_policy: never
    command: [node, dist/main.js]
    user: "${CONTACTS_UID:?}:${CONTACTS_GID:?}"
    environment:
      CONTACTS_CONFIG: /run/contacts/config.json
    volumes:
      - ${CONTACTS_RUNTIME_INPUTS:?}:/run/contacts:ro
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${CONTACTS_MEMORY:-256m}
    cpus: ${CONTACTS_CPUS:-1}
    restart: unless-stopped
    networks: [private]
  migrate:
    image: ${CONTACTS_IMAGE:?}
    pull_policy: never
    command: [node, dist/migrate.js]
    profiles: [setup]
    env_file: ["${CONTACTS_OWNER_ENV:?}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [private]
networks:
  private:
    external: true
    name: ${CONTACTS_NETWORK:?}
