# ABOUTME: Описывает синхронный v0 и устойчивый v1 NATS endpoints providers.
# ABOUTME: Структуры принадлежат локальным Draft-07 схемам; владельца удостоверяет broker ACL.
asyncapi: 2.6.0
info:
  title: Brai providers
  version: 1.0.0
  description: Изолированный синхронный decide, без дедупликации и повторов вычисления.
defaultContentType: application/json
channels:
  brai.providers.v0.invoke.decide:
    description: >-
      NATS Services brai_providers, queue brai_providers. Request-reply на inbox caller.
      Предел 32768 bytes вход /16384 bytes upstream, concurrency2, deadline≤30s.
      После unknown повтор вычисления автоматически запрещён. Сервисные ошибки
      имеют Nats-Service-Error и Nats-Service-Error-Code=500, без upstream text.
    bindings:
      nats:
        queue: brai_providers
        bindingVersion: 0.1.0
    subscribe:
      operationId: decide
      message:
        $ref: '#/components/messages/request'
    publish:
      operationId: decideReply
      message:
        oneOf:
          - $ref: '#/components/messages/response'
          - $ref: '#/components/messages/error'
  brai.providers.v1.invoke.decide:
    description: >-
      NATS Services brai_providers_v1, queue brai_providers_v1. Trusted owner ACL.
      Inference2, control8, no compute queue. Invoke returns durable acceptance.
      Replay same owner/operationId/input within7days; result24h. No inference retries.
      Request bytes65536 for invoke,2048 control; reply73728. Service errors code500.
    bindings:
      nats:
        queue: brai_providers_v1
        bindingVersion: 0.1.0
    subscribe:
      operationId: v1_invoke_decide
      message:
        $ref: '#/components/messages/v1_decideRequest'
    publish:
      operationId: v1_invoke_decide_reply
      message:
        oneOf:
          - $ref: '#/components/messages/v1_operation'
          - $ref: '#/components/messages/v1_error'
  brai.providers.v1.operations.get:
    description: >-
      NATS Services brai_providers_v1, queue brai_providers_v1. Trusted owner ACL.
      Inference2, control8, no compute queue. Invoke returns durable acceptance.
      Replay same owner/operationId/input within7days; result24h. No inference retries.
      Request bytes65536 for invoke,2048 control; reply73728. Service errors code500.
    bindings:
      nats:
        queue: brai_providers_v1
        bindingVersion: 0.1.0
    subscribe:
      operationId: v1_operations_get
      message:
        $ref: '#/components/messages/v1_operationKey'
    publish:
      operationId: v1_operations_get_reply
      message:
        oneOf:
          - $ref: '#/components/messages/v1_operation'
          - $ref: '#/components/messages/v1_error'
  brai.providers.v1.operations.cancel:
    description: >-
      NATS Services brai_providers_v1, queue brai_providers_v1. Trusted owner ACL.
      Inference2, control8, no compute queue. Invoke returns durable acceptance.
      Replay same owner/operationId/input within7days; result24h. No inference retries.
      Request bytes65536 for invoke,2048 control; reply73728. Service errors code500.
    bindings:
      nats:
        queue: brai_providers_v1
        bindingVersion: 0.1.0
    subscribe:
      operationId: v1_operations_cancel
      message:
        $ref: '#/components/messages/v1_operationKey'
    publish:
      operationId: v1_operations_cancel_reply
      message:
        oneOf:
          - $ref: '#/components/messages/v1_operation'
          - $ref: '#/components/messages/v1_error'
  brai.providers.v1.models.list:
    description: >-
      NATS Services brai_providers_v1, queue brai_providers_v1. Trusted owner ACL.
      Inference2, control8, no compute queue. Invoke returns durable acceptance.
