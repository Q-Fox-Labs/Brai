# ABOUTME: Описывает subjects и payload NATS Service artifacts.
# ABOUTME: HTTP передаёт байты; payload schemas принадлежат Draft-07 owner schema.
asyncapi: 3.1.0
info:
  title: Brai artifacts service
  version: '1.0.0'
  description: >-
    NATS Service name brai_artifacts; Core NATS request-reply, queue brai_artifacts.
    Instances support the standard PING, INFO and STATS endpoints.
    Successful replies are direct DTO payloads without JSON-RPC wrapping.
    Errors use Nats-Service-Error and Nats-Service-Error-Code response headers.
    A lost response has unknown outcome; prepare and link.create are retried with
    the same requestId. HTTP transfers raw file bytes only.
servers:
  privateNats:
    host: '{host}:{port}'
    protocol: nats
    description: Private NATS endpoint supplied by runtime configuration.
    variables:
      host:
        default: localhost
      port:
        default: '4222'
defaultContentType: application/json
x-http-upload:
  method: PUT
  path: /upload/{token}
  successStatus: 201
  successBody: absent
  responseHeaders:
    $ref: ./schemas/messages.schema.json#/definitions/UploadResponseHeaders
