  prepare:
    action: receive
    channel: { $ref: "#/channels/prepare" }
    messages: [{ $ref: "#/channels/prepare/messages/request" }]
    reply:
      channel: { $ref: "#/channels/replies" }
      messages: [{ $ref: "#/channels/replies/messages/PrepareResponse" }, { $ref: "#/channels/replies/messages/ServiceError" }]
    bindings:
      nats:
        queue: brai_artifacts
