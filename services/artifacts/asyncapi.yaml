  linkRevoke:
    address: brai.artifacts.v1.link.revoke
    messages:
      request:
        $ref: "#/components/messages/LinkRevokeRequest"
  replies:
    address: null
    description: Transient reply inbox from the NATS requester.
    x-nats-reply-subject: message.reply
    messages:
      PrepareResponse:
        $ref: "#/components/messages/PrepareResponse"
      Artifact:
        $ref: "#/components/messages/Artifact"
      ListResponse:
        $ref: "#/components/messages/ListResponse"
      StatsResponse:
        $ref: "#/components/messages/StatsResponse"
      RelationResponse:
        $ref: "#/components/messages/RelationResponse"
      RelationListResponse:
        $ref: "#/components/messages/RelationListResponse"
      ReferenceReserveResponse:
        $ref: "#/components/messages/ReferenceReserveResponse"
      ReferenceResponse:
        $ref: "#/components/messages/ReferenceResponse"
      ReferenceListResponse:
        $ref: "#/components/messages/ReferenceListResponse"
      LinkCreateResponse:
        $ref: "#/components/messages/LinkCreateResponse"
      LinkRevokeResponse:
        $ref: "#/components/messages/LinkRevokeResponse"
      ServiceError:
        $ref: "#/components/messages/ServiceError"
