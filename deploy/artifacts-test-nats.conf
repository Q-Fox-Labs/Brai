# ABOUTME: Изолирует NATS fixture для production image checks.
# ABOUTME: Broad ACL действует только в одноразовой тестовой сети.
port: 4222
jetstream { store_dir: /data }
authorization {
	users: [{ user: fixture, password: $NATS_TEST_PASSWORD, permissions: {
		publish: { allow: [">"] },
		subscribe: { allow: [">"] }
	} }]
}
