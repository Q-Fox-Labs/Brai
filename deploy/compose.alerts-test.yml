# ABOUTME: Поднимает отдельные PostgreSQL и NATS для приёмки alerts.
# ABOUTME: Только синтетические inputs, loopback и tmpfs; образы не загружаются.
name: brai-alerts-test
services:
  db:
    image: postgres:17.6-alpine3.22
    pull_policy: never
    environment:
      POSTGRES_PASSWORD: alerts-test
    ports: ["127.0.0.1:25641:5432"]
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./alerts-test-database.sql:/docker-entrypoint-initdb.d/01-alerts.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -U, alerts_test_owner, -d, brai_alerts_test]
      interval: 1s
      timeout: 3s
      retries: 30
    networks: [fixture]
  nats:
    image: nats:2.15.0
    pull_policy: never
    command: [--config, /etc/nats/nats.conf]
    ports: ["127.0.0.1:24341:4222"]
    tmpfs: [/data]
    volumes:
      - ./alerts-test-nats.conf:/etc/nats/nats.conf:ro
    networks: [fixture]
networks:
  fixture:
    labels:
      com.brai.fixture: alerts-test
