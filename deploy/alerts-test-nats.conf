# ABOUTME: Ограничивает тестовые роли входом, API alerts и служебными NATS subjects.
# ABOUTME: Пароли публичные синтетические; этот broker не подключён к production.
port: 4222
max_payload: 1048576
jetstream { store_dir: /data/jetstream, max_file_store: 536870912, max_memory_store: 16777216 }
authorization {
  users: [
    { user: fixture, password: "alerts-test", permissions: { publish: ">", subscribe: ">" } },
    { user: publisher, password: "alerts-test", permissions: {
      publish: { allow: ["brai.alerts.v1.ingest"] }, subscribe: { allow: ["_INBOX.brai_alerts_publisher.>"] }
    } },
    { user: alerts, password: "alerts-test", permissions: {
      publish: { allow: ["brai.alerts.v1.changed", "$JS.API.INFO", "$JS.API.STREAM.INFO.BRAI_ALERTS_INGEST_V1", "$JS.API.CONSUMER.INFO.BRAI_ALERTS_INGEST_V1.alerts_ingest", "$JS.API.CONSUMER.MSG.NEXT.BRAI_ALERTS_INGEST_V1.alerts_ingest", "$JS.ACK.BRAI_ALERTS_INGEST_V1.alerts_ingest.>"] },
      subscribe: { allow: ["brai.alerts.v1.query.list", "brai.alerts.v1.query.get", "brai.alerts.v1.query.summary", "brai.alerts.v1.command.read", "brai.alerts.v1.command.read_all", "_INBOX.brai_alerts.>", "$SRV.PING", "$SRV.PING.service_alerts", "$SRV.PING.service_alerts.*", "$SRV.INFO", "$SRV.INFO.service_alerts", "$SRV.INFO.service_alerts.*", "$SRV.STATS", "$SRV.STATS.service_alerts", "$SRV.STATS.service_alerts.*"] },
      allow_responses: { max: 1, expires: "15s" }
    } },
    { user: web, password: "alerts-test", permissions: {
      publish: { allow: ["brai.alerts.v1.query.list", "brai.alerts.v1.query.get", "brai.alerts.v1.query.summary", "brai.alerts.v1.command.read", "brai.alerts.v1.command.read_all", "brai.auth.v1.session", "brai.auth.v1.sign-out"] },
      subscribe: { allow: ["brai.alerts.v1.changed", "_INBOX.brai_web.>"] }
    } }
  ]
}
