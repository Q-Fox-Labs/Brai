# ABOUTME: Запускает production образы web, auth и timer рядом с Brai dependencies.
# ABOUTME: Сети и отдельные runtime env-файлы задаёт оператор.
name: brai
services:
  web:
    image: ${BRAI_WEB_IMAGE:-brai-web:production}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ${WEB_ENV_FILE:-./web.env}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    networks:
      - frontend
      - messaging
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(5000)}).then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 6s
      start_period: 10s
      retries: 3

  timer:
    image: ${BRAI_TIMER_IMAGE:-brai-timer:production}
    build:
      context: ..
      dockerfile: services/timer/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ${TIMER_ENV_FILE:-./timer.env}
    environment:
      NODE_ENV: production
    networks:
      - messaging
      - database

  auth:
    image: ${BRAI_AUTH_IMAGE:-brai-auth:production}
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ${AUTH_ENV_FILE:-./auth.env}
      - ${RESEND_ENV_FILE:-./resend.env}
    environment:
      NODE_ENV: production
    networks:
      - messaging
      - database

  auth-migrate:
    image: ${BRAI_AUTH_IMAGE:-brai-auth:production}
    profiles: [migration]
    restart: "no"
    init: true
    working_dir: /app/services/auth
    command: ["node", "dist/migrate.js"]
    healthcheck:
      disable: true
    env_file:
      - ${AUTH_MIGRATION_ENV_FILE:-./auth-migration.env}
    environment:
      NODE_ENV: production
    networks:
      - database

  timer-migrate:
    image: ${BRAI_TIMER_IMAGE:-brai-timer:production}
    profiles: [migration]
    restart: "no"
    init: true
    working_dir: /app/services/timer
    command: ["node", "dist/migrate.js"]
    healthcheck:
      disable: true
    env_file:
      - ${TIMER_MIGRATION_ENV_FILE:-./timer-migration.env}
    environment:
      NODE_ENV: production
    networks:
      - database

  supabase-mcp:
    image: ${BRAI_SUPABASE_MCP_IMAGE:-brai-supabase-mcp:production}
    build:
      context: ..
      dockerfile: services/supabase-mcp/Dockerfile
    profiles: [supabase-mcp]
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      SUPABASE_MCP_CONFIG: /run/supabase-mcp/config.json
    ports:
      - "127.0.0.1:${BRAI_SUPABASE_MCP_HOST_PORT:-3001}:3001"
    volumes:
      - type: bind
        source: ${BRAI_SUPABASE_MCP_CONFIG_FILE:-./supabase-mcp.json}
        target: /run/supabase-mcp/config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BRAI_SUPABASE_MCP_PASSWORD_FILE:-./supabase-mcp-password}
        target: /run/secrets/postgres_password
        read_only: true
        bind:
          create_host_path: false
    networks:
      - database
      - mcp

networks:
  frontend:
    name: ${BRAI_FRONTEND_NETWORK:?Set BRAI_FRONTEND_NETWORK to the reverse-proxy bridge network}
    external: true
  messaging:
    name: ${BRAI_NATS_NETWORK:?Set BRAI_NATS_NETWORK to the NATS bridge network}
    external: true
  database:
    name: ${BRAI_DATABASE_NETWORK:?Set BRAI_DATABASE_NETWORK to the private database network}
    external: true
  mcp:
    name: ${BRAI_MCP_NETWORK:-brai_mcp}
    external: true
