# ABOUTME: Устанавливает только необходимые runtime и исходники клиентского экземпляра.
# ABOUTME: Не переносит аккаунты оператора, SSH, netplan и средства разработки.
---
- name: Install supported host packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, git, xz-utils, python3-venv, docker.io, docker-compose-v2, busybox-static, acl, bubblewrap]
    state: present
    update_cache: true
- name: Create the application runtime identity
  ansible.builtin.group:
    name: agent
    gid: '{{ brai_install_manifest.directories["/home/agent"].gid }}'
- name: Create the application runtime account
  ansible.builtin.user:
    name: agent
    uid: '{{ brai_install_manifest.directories["/home/agent"].uid }}'
    group: agent
    home: /home/agent
    create_home: true
    shell: /bin/bash
- name: Enable Docker
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
- name: Install the declared Node.js release
  ansible.builtin.import_tasks: nodejs.yml
- name: Create runtime-owned Codex directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: agent
    group: agent
    mode: '0700'
  loop: [/home/agent/.codex, /home/agent/.codex/app-server-control]
- name: Install the declared Codex release
  ansible.builtin.import_tasks: codex.yml
- name: Install protected Git credential helper
  ansible.builtin.copy:
    src: git-askpass.py
    dest: '{{ brai_install_root }}/git-askpass.py'
    owner: root
    group: root
    mode: '0700'
- name: Check the product source destination
  ansible.builtin.stat:
    path: /srv/projects/brai/.git
    follow: false
  register: brai_source
- name: Require an ordinary whole checkout metadata directory
  ansible.builtin.assert:
    that: not brai_source.stat.exists or brai_source.stat.isdir | default(false)
- name: Create the product source parent
  ansible.builtin.file:
    path: /srv/projects
    state: directory
    mode: '0755'
- name: Download the whole product repository at the declared source revision
  ansible.builtin.git:
    repo: https://github.com/Q-Fox-Labs/Brai.git
    dest: /srv/projects/brai
    version: '{{ brai_install_manifest.source_revisions.prod }}'
    update: false
    recursive: false
  environment:
    GIT_ASKPASS: '{{ brai_install_root }}/git-askpass.py'
    BRAI_INSTALL_ROOT: '{{ brai_install_root }}'
    GIT_TERMINAL_PROMPT: '0'
  when: not brai_source.stat.exists
  no_log: true
- name: Name the newly downloaded production checkout main
  ansible.builtin.command:
    argv: [/usr/bin/git, -c, safe.directory=/srv/projects/brai, -C, /srv/projects/brai, switch, -C, main]
  when: not brai_source.stat.exists
- name: Assign the new whole checkout to its runtime owner
  ansible.builtin.file:
    path: /srv/projects/brai
    owner: agent
    group: agent
    recurse: true
  when: not brai_source.stat.exists
- name: Verify an existing product repository without resetting it
  ansible.builtin.command:
    argv: [/usr/bin/git, -c, safe.directory=/srv/projects/brai, -C, /srv/projects/brai, remote, get-url, origin]
  register: brai_source_origin
  changed_when: false
- name: Require the declared whole product repository
  ansible.builtin.assert:
    that: brai_source_origin.stdout in ['https://github.com/Q-Fox-Labs/Brai.git', 'https://github.com/Q-Fox-Labs/Brai']
- name: Verify the existing source root and branch without resetting it
  ansible.builtin.command:
    argv: '{{ ["/usr/bin/git", "-c", "safe.directory=/srv/projects/brai", "-C", "/srv/projects/brai"] + item }}'
  loop: [[rev-parse, --show-toplevel], [symbolic-ref, --quiet, --short, HEAD]]
  register: brai_source_identity
  changed_when: false
- name: Require the production source root and main branch
  ansible.builtin.assert:
    that:
      - brai_source_identity.results[0].stdout == '/srv/projects/brai'
      - brai_source_identity.results[1].stdout == 'main'
- name: Install the native product Codex backend
  ansible.builtin.copy:
    dest: /etc/systemd/system/codex-native-agent.service
    mode: '0644'
    content: |
      [Unit]
      After=network-online.target
      [Service]
      User=agent
      Group=agent
      WorkingDirectory=/srv/projects/brai
      Environment=HOME=/home/agent
      Environment=CODEX_HOME=/home/agent/.codex
      Environment=PATH=/usr/local/bin:/usr/bin:/bin
      ExecStart=/home/agent/.codex/packages/app-server-daemon/current/bin/codex app-server --listen unix:///home/agent/.codex/app-server-control/app-server-control.sock
      Restart=on-failure
      UMask=0077
      [Install]
      WantedBy=multi-user.target
- name: Start the native product Codex backend
  ansible.builtin.systemd_service:
    name: codex-native-agent.service
    enabled: true
    state: started
    daemon_reload: true
