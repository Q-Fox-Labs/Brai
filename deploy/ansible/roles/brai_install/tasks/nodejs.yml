# ABOUTME: Устанавливает закреплённый официальный выпуск Node.js вместе с npm.
# ABOUTME: Проверяет SHA-256 архива по опубликованному Node.js manifest.
---
- name: Create Node.js download directory
  ansible.builtin.file:
    path: "{{ nodejs_download_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download official Node.js checksums
  ansible.builtin.get_url:
    url: "https://nodejs.org/dist/v{{ nodejs_version }}/SHASUMS256.txt"
    dest: "{{ nodejs_download_dir }}/SHASUMS256.txt"
    owner: root
    group: root
    mode: '0644'

- name: Read checksum for the selected Node.js archive
  ansible.builtin.command:
    argv:
      - /usr/bin/awk
      - -v
      - "filename={{ nodejs_archive_name }}"
      - '$2 == filename { print $1 }'
      - "{{ nodejs_download_dir }}/SHASUMS256.txt"
  register: nodejs_archive_checksum
  changed_when: false

- name: Validate Node.js archive checksum entry
  ansible.builtin.assert:
    that:
      - nodejs_archive_checksum.stdout | length == 64
      - nodejs_archive_checksum.stdout is match('^[0-9a-f]{64}$')
    fail_msg: Official Node.js checksum manifest has no valid entry for the selected archive.

- name: Download verified Node.js archive
  ansible.builtin.get_url:
    url: "https://nodejs.org/dist/v{{ nodejs_version }}/{{ nodejs_archive_name }}"
    dest: "{{ nodejs_download_dir }}/{{ nodejs_archive_name }}"
    checksum: "sha256:{{ nodejs_archive_checksum.stdout }}"
    owner: root
    group: root
    mode: '0644'

- name: Extract official Node.js distribution
  ansible.builtin.unarchive:
    src: "{{ nodejs_download_dir }}/{{ nodejs_archive_name }}"
    dest: /opt
    remote_src: true
    creates: "{{ nodejs_install_dir }}/bin/node"

- name: Link Node.js executables into the system path
  when: nodejs_activate | default(true) | bool
  ansible.builtin.file:
    src: "{{ nodejs_install_dir }}/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - node
    - npm
    - npx
