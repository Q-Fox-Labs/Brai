# ABOUTME: Устанавливает одну ежедневную read-only проверку принятого состава.
# ABOUTME: Не запускает восстановление, обновления или миграции.
---
- name: Install daily read-only installation verification units
  ansible.builtin.copy:
    dest: '/etc/systemd/system/{{ item.name }}'
    owner: root
    group: root
    mode: '0644'
    content: '{{ item.content }}'
  loop:
    - name: brai-install-verify.service
      content: |
        [Unit]
        After=docker.service network-online.target
        [Service]
        Type=oneshot
        ExecStart=/usr/bin/python3 -B {{ brai_install_root }}/{{ 'install_admin.py' if brai_install_administrative else 'install_server.py' }} verify --manifest {{ brai_install_root }}/baseline.json --inputs {{ brai_install_root }}/inputs.json --root {{ brai_install_root }}
        UMask=0077
        TimeoutStartSec=1800
    - name: brai-install-verify.timer
      content: |
        [Unit]
        Description=Daily read-only installation verification
        [Timer]
        OnCalendar=daily
        Persistent=true
        [Install]
        WantedBy=timers.target
- name: Enable the read-only timer after installation acceptance
  ansible.builtin.systemd_service:
    name: brai-install-verify.timer
    daemon_reload: true
    enabled: true
    state: started
