# ABOUTME: Задаёт параметры самостоятельной установки Brai.
# ABOUTME: Настройки экземпляра и credentials передаются извне.
---
brai_install_manifest: '{{ lookup("file", role_path + "/files/product.json") | from_json }}'
brai_install_inputs: '{{ fresh_install_inputs }}'
brai_install_root: /var/lib/brai-install
brai_install_bootstrap: true
brai_install_administrative: false
brai_install_admin_runner: ''
nodejs_version: 24.22.1
nodejs_download_dir: /var/cache/brai-node
nodejs_archive_name: node-v24.22.1-linux-x64.tar.xz
nodejs_install_dir: /opt/node-v24.22.1-linux-x64
recovery_codex_install_version: 0.164.0
recovery_codex_installer_sha256: 95d14ccaba915e52a3f0cc590638ca5ac510086ff6a23dc9ac9f77e957403a93
