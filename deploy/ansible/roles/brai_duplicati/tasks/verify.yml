# ABOUTME: Проверяет клиентскую службу без чтения секретов или запуска копирования.
# ABOUTME: Выполняет тот же код, что ежедневный аудит, без установки файлов на сервер.
---
- name: Verify installed backup service without changing it
  ansible.builtin.command:
    argv: [/usr/bin/python3, -B, -c, "{{ lookup('template', 'verify-duplicati.py.j2') }}"]
  register: duplicati_verification
  until: duplicati_verification.rc == 0
  retries: 12
  delay: 2
  changed_when: false
  check_mode: false
