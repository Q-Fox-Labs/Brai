# ABOUTME: Проверяет чистую клиентскую установку на одноразовом Ubuntu раннере GitHub.
# ABOUTME: Использует штатный Ansible, отдельные тестовые входы и открытые сводки без секретов.
name: Client install smoke

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Brai SHA declared in the test client manifest
        required: true
        type: string
      install_path:
        description: Installer or isolated Compose startup from the same candidate
        required: true
        type: choice
        default: client
        options: [client, compose]
      verify_vad:
        description: Also verify the candidate's restricted VAD snapshot
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  install:
    if: github.repository == 'Q-Fox-Labs/Brai' && inputs.install_path == 'client'
    name: Client install smoke
    environment: brai-clean-install
    env:
      BRAI_CI_SOURCE_SHA: ${{ inputs.source_sha }}
      ADMIN_REPOSITORY: ${{ vars.BRAI_CI_ADMIN_REPOSITORY || 'Q-Fox-Labs/Q-Server' }}
      ADMIN_SHA: ${{ vars.BRAI_CI_ADMIN_SHA || 'da1762ee80ac4a42ca2afa8a5369e5b9ca577ee8' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the candidate and measure available disk
        run: |
          [[ "$BRAI_CI_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo 'Set a full Brai commit SHA in source_sha.' >&2
            exit 1
          }
          git fetch --no-tags --depth=1 origin "$BRAI_CI_SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$BRAI_CI_SOURCE_SHA"
          printf 'Candidate: %s\nCPU cores: %s\n' "$BRAI_CI_SOURCE_SHA" "$(nproc)"
          df -B1 --output=target,size,avail / /var/lib/docker
      - name: Check installer access
        env:
          BRAI_CI_ADMIN_TOKEN: ${{ secrets.BRAI_CI_ADMIN_TOKEN }}
          BRAI_CI_ADMIN_SSH_KEY: ${{ secrets.BRAI_CI_ADMIN_SSH_KEY }}
        run: |
          [[ "$ADMIN_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ && "$ADMIN_SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo 'Use an owner/repository and full commit SHA for Admin.' >&2
            exit 1
          }
          if [[ -z "$BRAI_CI_ADMIN_SSH_KEY" && -z "$BRAI_CI_ADMIN_TOKEN" ]]; then
            echo 'Set a read-only Admin deploy key or token in the brai-clean-install environment.' >&2
            exit 1
          fi
      - name: Check out the installer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.ADMIN_REPOSITORY }}
          ref: ${{ env.ADMIN_SHA }}
          ssh-key: ${{ secrets.BRAI_CI_ADMIN_SSH_KEY }}
          token: ${{ secrets.BRAI_CI_ADMIN_TOKEN || github.token }}
          path: installer
          persist-credentials: false
      - name: Verify the installer revision
        working-directory: installer
        run: |
          test "$(git rev-parse HEAD)" = "$ADMIN_SHA"
          test -f ansible/client/install.yml
          printf 'Verified client installer at Admin %s\n' "$ADMIN_SHA"
      - name: Check test inputs
        env:
          BRAI_CI_INSTALL_BUNDLE: ${{ secrets.BRAI_CI_INSTALL_BUNDLE }}
          BRAI_CI_HF_TOKEN: ${{ secrets.BRAI_CI_HF_TOKEN }}
        run: |
          missing=()
          for input in BRAI_CI_INSTALL_BUNDLE BRAI_CI_HF_TOKEN; do
            [[ -n "${!input}" ]] || missing+=("$input")
          done
          if (("${#missing[@]}")); then
            printf 'Missing Actions secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
      - name: Prepare the disposable runner
        run: |
          # The runner image leaves /opt writable by everyone. The client requires trusted parents.
          sudo chmod go-w /opt
          sudo rm -rf -- /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -B1 --output=target,size,avail / /var/lib/docker
          # The installer installs Ubuntu's docker.io. Remove conflicting packages from the Actions image.
          packages=()
          for package in docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin docker-ce-rootless-extras; do
            if [[ "$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null)" == installed ]]; then
              packages+=("$package")
            fi
          done
          if (("${#packages[@]}")); then
            sudo apt-get purge -y "${packages[@]}"
          fi
      - name: Prepare the test inputs and run the client installer
        env:
          BRAI_CI_INSTALL_BUNDLE: ${{ secrets.BRAI_CI_INSTALL_BUNDLE }}
          BRAI_CI_HF_TOKEN: ${{ secrets.BRAI_CI_HF_TOKEN }}
          BRAI_CI_MEMOS_SDK_URL: ${{ secrets.BRAI_CI_MEMOS_SDK_URL }}
          BRAI_CI_RELEASE_PACKAGES_URL: ${{ secrets.BRAI_CI_RELEASE_PACKAGES_URL }}
          BRAI_CI_ARCHIVE_PASSPHRASE: ${{ secrets.BRAI_CI_ARCHIVE_PASSPHRASE }}
          BRAI_CI_TELEGRAM_BOT_TOKEN: ${{ secrets.BRAI_CI_TELEGRAM_BOT_TOKEN }}
          BRAI_CI_REGISTRY_TOKEN: ${{ secrets.BRAI_CI_REGISTRY_TOKEN }}
          BRAI_CI_REGISTRY_USER: ${{ vars.BRAI_CI_REGISTRY_USER }}
          CI_PACKAGES_TOKEN: ${{ github.token }}
        run: bash deploy/ci/run-client-install-smoke.sh "$GITHUB_WORKSPACE/installer"

  compose:
    if: github.repository == 'Q-Fox-Labs/Brai' && inputs.install_path == 'compose'
    name: Candidate Compose install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Build and start Brai on an empty runner
        env:
          BRAI_CI_SOURCE_SHA: ${{ inputs.source_sha }}
        run: bash deploy/ci/run-compose-install-smoke.sh

  vad:
    if: github.repository == 'Q-Fox-Labs/Brai' && inputs.install_path == 'compose' && inputs.verify_vad
    name: Verify the candidate VAD snapshot
    environment: brai-clean-install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Match the candidate and download the pinned VAD
        env:
          BRAI_CI_SOURCE_SHA: ${{ inputs.source_sha }}
          HF_TOKEN: ${{ secrets.BRAI_CI_HF_TOKEN }}
        run: |
          [[ "$BRAI_CI_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          runner_path=services/local-ai/runners/gigaam
          git fetch --no-tags --depth=1 origin "$BRAI_CI_SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$BRAI_CI_SOURCE_SHA"
          git show "FETCH_HEAD:$runner_path/vad_manifest.json" | cmp - "$runner_path/vad_manifest.json"
          python3 -B "$runner_path/prepare_vad.py" --model-dir "$RUNNER_TEMP/brai-vad"
          jq -r '"Verified VAD revision: \(.revision). Snapshot bytes: \([.files[].bytes] | add)."' "$RUNNER_TEMP/brai-vad/manifest.json"
