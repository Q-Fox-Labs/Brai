# ABOUTME: Tests the private client PROD installer candidate on fresh GitHub-hosted Ubuntu.
# ABOUTME: Passes the stock manifest and bounded test credentials as protected Ansible input.
name: Stock PROD clean install

on:
  workflow_dispatch:
  push:
    branches: [feature/stock-prod-clean-20261123]
    paths: [.github/workflows/stock-prod.launch]

permissions:
  contents: read
  packages: read

concurrency:
  group: stock-prod-clean-install
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'Q-Fox-Labs/Brai' && github.ref == 'refs/heads/feature/stock-prod-clean-20261123'
    runs-on: ubuntu-24.04
    environment: stock-prod-clean-install
    env:
      STOCK_ADMIN_SHA: 06f5ea4c6f970faff7e8c35e655a810a65e05ae5
      STOCK_PATCH_SHA256: 32add27e1e3e36633cc9c8117dc825d88ae2d5fd2252ee8721e231c9d9d6b96a
      STOCK_ANSIBLE_CORE: '2.21.6'
      STOCK_ANSIBLE_POSIX: '2.2.2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Q-Fox-Labs/Q-Server
          ssh-key: ${{ secrets.STOCK_PROD_ADMIN_READ_KEY }}
          ref: ${{ env.STOCK_ADMIN_SHA }}
          persist-credentials: false
      - name: Apply the verified private Admin candidate
        shell: bash
        env:
          STOCK_ADMIN_PATCH: ${{ secrets.STOCK_PROD_ADMIN_PATCH }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STOCK_ADMIN_SHA"
          test -n "$STOCK_ADMIN_PATCH"
          umask 077
          patch_file=$(mktemp "$RUNNER_TEMP/admin-candidate.XXXXXXXX")
          trap 'rm -f -- "$patch_file"' EXIT
          printf '%s' "$STOCK_ADMIN_PATCH" | base64 --decode | gzip --decompress > "$patch_file"
          unset STOCK_ADMIN_PATCH
          printf '%s  %s\n' "$STOCK_PATCH_SHA256" "$patch_file" | sha256sum --check --status
          git apply --check --whitespace=error "$patch_file"
          git apply --whitespace=error "$patch_file"
      - name: Install Ansible and its ACL module, then check protected YAML
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STOCK_ADMIN_SHA"
          venv="$RUNNER_TEMP/stock-ansible"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip --disable-pip-version-check install "ansible-core==$STOCK_ANSIBLE_CORE"
          export ANSIBLE_COLLECTIONS_PATH="$RUNNER_TEMP/stock-collections"
          "$venv/bin/ansible-galaxy" collection install --collections-path "$ANSIBLE_COLLECTIONS_PATH" \
            "ansible.posix:==$STOCK_ANSIBLE_POSIX"
          "$venv/bin/ansible-doc" -t module ansible.posix.acl >/dev/null
          ANSIBLE_LOCAL_TEMP="$RUNNER_TEMP/stock-ansible-synthetic" "$venv/bin/python" -B \
            -m unittest discover -s ansible/roles/fresh_install/tests -p test_protected_bundle.py -v
          "$venv/bin/ansible-playbook" --version | sed -n '1p'
      - name: Prepare Ubuntu for the documented client bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          printf 'CPU cores: %s\n' "$(nproc)"
          df -h /
          test ! -e /var/lib/brai-install/owner.json
          test ! -e /opt/supabase/deployment/volumes/db/data/PG_VERSION
          printf '127.0.0.1 brai-ci.localhost\n' | sudo tee -a /etc/hosts >/dev/null
          sudo setfacl --remove-default -- /opt
          sudo chmod go-w /opt
          conflicting=()
          for package in docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin docker-ce-rootless-extras; do
            if [[ "$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null)" == installed ]]; then
              conflicting+=("$package")
            fi
          done
          if (("${#conflicting[@]}")); then
            sudo apt-get purge -y "${conflicting[@]}"
          fi
      - name: Reproduce the stock Chrome role without protected inputs
        if: github.event.head_commit.message == 'Probe native Chrome prerequisites'
        shell: bash
        run: |
          set -euo pipefail
          probe=$(mktemp -d "$RUNNER_TEMP/stock-chrome.XXXXXXXX")
          finish_probe() {
            local result=$?
            trap - EXIT
            if ((result)); then
              chrome=/opt/agent-browser-tools/chrome/154.0.8037.92/chrome-linux64
              sudo namei -l "$chrome" || true
              sudo getfacl -p /opt /opt/agent-browser-tools /opt/agent-browser-tools/chrome \
                "$(dirname "$chrome")" "$chrome" || true
            fi
            rm -rf -- "$probe"
            exit "$result"
          }
          trap finish_probe EXIT
          cat >"$probe/probe.yml" <<'YAML'
          - hosts: localhost
            gather_facts: false
            vars:
              brai_native_chrome_root: /opt/agent-browser-tools/chrome/154.0.8037.92/chrome-linux64
            tasks:
              - ansible.builtin.include_role:
                  name: brai_install
                  tasks_from: native_chrome
          YAML
          cd ansible
          stat -c '%u:%g %a %n' / /opt /etc /var /var/cache
          sudo -n /bin/bash -c '
            umask 022
            export ANSIBLE_ROLES_PATH="$1"
            shift
            exec "$@"
          ' bash "$PWD/client/roles" "$RUNNER_TEMP/stock-ansible/bin/ansible-playbook" \
            -i localhost, -c local "$probe/probe.yml"
          chrome=/opt/agent-browser-tools/chrome/154.0.8037.92/chrome-linux64/chrome
          profile=/var/lib/brai-ci-chrome
          runner_user=$(id -un)
          sudo -n install -d -m 0700 -o "$runner_user" -g "$(id -gn)" "$profile"
          printf 'AppArmor user namespace restriction: '
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          sudo -n systemd-run --wait --collect --quiet --pipe \
            --property="User=$runner_user" --property=NoNewPrivileges=true \
            --property=ProtectSystem=strict --property=ProtectHome=true \
            --property=PrivateTmp=true --property=PrivateDevices=true \
            --property=CapabilityBoundingSet= --property="ReadWritePaths=$profile" \
            --setenv="HOME=$profile" --setenv="XDG_CACHE_HOME=$profile/cache" \
            "$chrome" --headless=new --no-first-run --disable-background-networking \
            --user-data-dir="$profile" --dump-dom about:blank
      - name: Run the stock client PROD installer
        if: github.event.head_commit.message != 'Probe native Chrome prerequisites'
        id: installer
        shell: bash
        env:
          INPUT_PART_1: ${{ secrets.STOCK_PROD_INPUT_PART_1 }}
          INPUT_PART_2: ${{ secrets.STOCK_PROD_INPUT_PART_2 }}
          INPUT_PART_3: ${{ secrets.STOCK_PROD_INPUT_PART_3 }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/stock-prod.XXXXXXXX")
          cat > "$work/diagnostics-recipient.pem" <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIEMzCCApugAwIBAgIUXzoCziSDzWavaXp0jcDdBzNbfTswDQYJKoZIhvcNAQEL
          BQAwKTEnMCUGA1UEAwweQnJhaSBjbGVhbiBpbnN0YWxsIGRpYWdub3N0aWNzMB4X
          DTI2MTEyMzE1NTc0OFoXDTI2MTIyMzE1NTc0OFowKTEnMCUGA1UEAwweQnJhaSBj
          bGVhbiBpbnN0YWxsIGRpYWdub3N0aWNzMIIBojANBgkqhkiG9w0BAQEFAAOCAY8A
          MIIBigKCAYEA4aA2i5PW6e1gT2B71G4NAoNoFXW0v2sPDfki67Qm/GdkNkFIXwHB
          JiG/prEdrgtkUiENmscGzOqtHHatNfO5If827DQbg1glESBHBN3IlUjKicIBKbP6
          X6o/YJkB8EGCYDjDBj8widW+SFYjPpk7SEQfrKf0n13rQ2E1Qlm5GaVe9KrqGaHb
          xfeFe9qIAlKQ70hL0vJWOpxU3+BW0WjWVs+dsw62btWyxJdRBc05m31Swuemlp/l
          k86HzTz2ZjgQkYxYs9wEYs8pFDL2tVtHmy1/INuEgyQcBKAdSJ0ayCMWAo5ESm/6
          qEkTpQXRcotdOZHQNvWF5xyXTpR7EhW77AJGuYlYsLeOTT6iCjvzgx4GckvIWv+p
          NwCh8OsBx3oLtrxU44ATgCc5ROr36UfjyZwqkUISNkmNuJyG1DNucwPMrI+sOK0x
          UAToVJYX/8mHecJ1DdizPVIdXOXeWQG8WwOBy4SDcqcGE9FC18qVCAShnM31WoYI
          AXsLWq89U4WRAgMBAAGjUzBRMB0GA1UdDgQWBBQc9pJZf8BxIgVWEslZsSLSS0bi
          9TAfBgNVHSMEGDAWgBQc9pJZf8BxIgVWEslZsSLSS0bi9TAPBgNVHRMBAf8EBTAD
          AQH/MA0GCSqGSIb3DQEBCwUAA4IBgQDRuiKV3Suqq/EnF4zyuiHA2ndjMKGJa/xM
          J1N+Gghf+SupvSZjZFE7/f+1zXVrtUGqFwKiIdxEO7/Ggt/0h6hM91daO2tEzO1Y
          d2wNLfWyPuhmMJs8ybJajWn9Gr5f0chjSpOuJmhBh1Vu2TvoGuwmggG4li1LLnm7
          ZNi0jLgrniRhKVIW9x86AspMjxmfMYVjcIo3DY7/BkxtyVL+2/rcow1os0keOBNy
          xWVW5bVHbEOj7W6PmCkCYxTT9RyhGEj1IjExJVHM7MIEKUmYxfJUmbByQ/fZPbwY
          aCHWQvKyr8r6Jp8u0DGL8MroGqZOgJzYfPaJxdKY2DQk3pccsAgUaFTDsvb/+nzX
          rAghWONtUt23NsYINyV26QM0Fk4q4nM5/GFISJXzHPA8FEkAXFjMB+K38eyfV3dE
          Cdn+bl75eosgYdfSxGg04/xAwy6b+emLw8w1enn0y4Jr43ajlAjR41geJucHP8IQ
          tYKwCEknzJJs1fN/+1PJrzbPMeEoH6k=
          -----END CERTIFICATE-----
          PEM
          report() {
            local code=$?
            trap - EXIT
            if ((code)); then
              if sudo -n test -f /var/lib/brai-install/owner.json; then
                echo 'Installer accepted the manifest and protected inputs.'
              fi
              if [[ -s "$work/ansible.log" ]]; then
                {
                  cat "$work/ansible.log"
                  if [[ -f "$work/verify.log" ]]; then cat "$work/verify.log"; fi
                  printf '\n--- HERMES SERVICE DIAGNOSTICS ---\n'
                  for unit in brai-hermes-production-{codex-bridge,embeddings,memos,browser,intake}.service; do
                    sudo -n systemctl show "$unit" --property=Id,ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,NRestarts || true
                    sudo -n journalctl --unit "$unit" --lines 40 --no-pager || true
                  done
                  if sudo -n test -f /var/lib/brai-install/command-failure.json; then
                    printf '\n--- ROOT COMMAND FAILURE ---\n'
                    sudo -n cat /var/lib/brai-install/command-failure.json
                  fi
                  if sudo -n test -f /var/lib/brai-install/model-operations.json; then
                    printf '\n--- MODEL OPERATIONS ---\n'
                    sudo -n cat /var/lib/brai-install/model-operations.json
                  fi
                  local local_ai=brai-local-ai-op3-main-8683b1d1
                  printf '\n--- LOCAL AI CONTAINER STATE ---\n'
                  if sudo -n docker inspect --format '{{json .State}}' "$local_ai" 2>/dev/null; then
                    printf '\n--- LOCAL AI LOG ---\n'
                    sudo -n docker logs --tail 120 "$local_ai" 2>&1 || true
                    printf '\n--- LOCAL AI DOWNLOAD PROBE ---\n'
                    sudo -n docker exec -i "$local_ai" node --input-type=module - 2>&1 <<'PROBE' || true
          const base = 'https://huggingface.co/ai-sage/GigaAM-v3/resolve/cec030b4c4f35d928e4a9044a3bdb29ebd499fac/';
          const files = ['config.json', 'modeling_gigaam.py', 'pytorch_model.bin', 'tokenizer.model'];
          for (const file of files) {
            try {
              const response = await fetch(base + file + '?download=true', {
                headers: { accept: 'application/octet-stream' }, signal: AbortSignal.timeout(30000),
              });
              console.log(JSON.stringify({file, status: response.status, length: response.headers.get('content-length')}));
              await response.body?.cancel();
            } catch (error) {
              console.log(JSON.stringify({file, error: error.name, reason: error.cause?.code}));
            }
          }
          PROBE
                  fi
                } > "$work/failure.log"
                if ! openssl cms -encrypt -aes-256-gcm -binary -in "$work/failure.log" \
                  -outform DER -out "$RUNNER_TEMP/stock-install-failure.cms" \
                  "$work/diagnostics-recipient.pem"; then
                  rm -f "$RUNNER_TEMP/stock-install-failure.cms"
                  echo 'Failed to preserve encrypted diagnostics.'
                fi
              fi
            fi
            rm -rf -- "$work"
            exit "$code"
          }
          trap report EXIT
          test -n "$INPUT_PART_1"
          printf '%s' "$INPUT_PART_1$INPUT_PART_2$INPUT_PART_3" | base64 --decode | gzip --decompress > "$work/inputs.yml"
          unset INPUT_PART_1 INPUT_PART_2 INPUT_PART_3
          "$RUNNER_TEMP/stock-ansible/bin/python" -B - "$work/inputs.yml" <<'INPUTS'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'ansible/roles/fresh_install/files')
          from protected_bundle import dumps, loads
          path = Path(sys.argv[1])
          values = loads(path.read_text())
          inputs = values['fresh_install_inputs']
          if inputs.get('public_origin') != 'https://brai-ci.localhost':
              raise SystemExit('Unexpected isolated HTTPS origin.')
          inputs['public_urls'] = ['https://brai-ci.localhost/api/timer']
          path.write_text(dumps(values))
          INPUTS
          printf '[managed]\nlocalhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3\n' > "$work/hosts.ini"
          cd ansible
          run_installer() {
            sudo -n /bin/bash -c '
            umask 022
            export ANSIBLE_NOCOLOR=1 PYTHONUNBUFFERED=1
            export ANSIBLE_COLLECTIONS_PATH="$1"
            shift
            exec "$@"
          ' bash "$RUNNER_TEMP/stock-collections" "$RUNNER_TEMP/stock-ansible/bin/ansible-playbook" \
            -i "$work/hosts.ini" client/install.yml \
            --extra-vars "@$work/inputs.yml" --extra-vars brai_install_capture_failure=true \
            2>&1 | tee "$work/ansible.log" | python3 -u -c '
          import re, sys
          from pathlib import Path
          names = {
              match.group(1).strip().strip(chr(39) + chr(34))
              for file in Path(".").rglob("*.yml")
              for match in re.finditer(r"^\s*-\s+name:\s*([^\n{}]+)$", file.read_text(errors="replace"), re.M)
          }
          for line in sys.stdin:
              match = re.fullmatch(r"TASK \[([^\[\]\n]+)\] \*+\n", line)
              if match and match.group(1).rsplit(" : ", 1)[-1] in names:
                  print(line, end="")
            '
          }
          run_installer
          sudo test -f /var/lib/brai-install/completed.json
          sudo -n docker exec --user postgres supabase-db psql -X -q -U supabase_admin -d postgres \
            -v ON_ERROR_STOP=1 -c "CREATE TABLE public.brai_ci_reinstall_probe (marker text PRIMARY KEY); INSERT INTO public.brai_ci_reinstall_probe VALUES ('first-install');"
          echo 'First clean install completed, including the TLS-verified HTTPS check.'
          run_installer
          test "$(sudo -n docker exec --user postgres supabase-db psql -X -qAt -U supabase_admin -d postgres \
            -v ON_ERROR_STOP=1 -c 'SELECT marker FROM public.brai_ci_reinstall_probe;')" = first-install
          sudo -n /usr/bin/env BRAI_INSTALL_CAPTURE_FAILURE=1 \
            /usr/bin/python3 -B /var/lib/brai-install/install_server.py verify \
            --manifest /var/lib/brai-install/baseline.json --inputs /var/lib/brai-install/inputs.json \
            > "$work/verify.log" 2>&1
          echo 'Clean install, repeat install with retained PostgreSQL data, and independent verify passed.'
          local_ai_unit=$(sudo -n python3 -B -c 'import json; p=json.load(open("/var/lib/brai-install/compose-launch.json")); print("brai-install-"+p["local_ai"][0]["project"]+".service")')
          sudo -n systemctl is-enabled --quiet "$local_ai_unit"
          sudo -n systemctl restart "$local_ai_unit" brai-hermes-production.service
          sudo -n /usr/bin/env BRAI_INSTALL_CAPTURE_FAILURE=1 \
            /usr/bin/python3 -B /var/lib/brai-install/install_server.py verify \
            --manifest /var/lib/brai-install/baseline.json --inputs /var/lib/brai-install/inputs.json \
            >> "$work/verify.log" 2>&1
          test "$RUNNER_ENVIRONMENT" = github-hosted
          unit=brai-hermes-production.service
          owner=$(sudo -n systemctl show "$unit" --property=User --value)
          test "$owner" = brai-hermes-production
          sudo -n systemctl is-active --quiet "$unit"
          sudo -n systemctl is-enabled --quiet "$unit"
          sudo -n systemctl is-enabled --quiet docker.service
          if ! command -v espeak-ng >/dev/null; then
            sudo -n apt-get install -y --no-install-recommends espeak-ng
          fi
          probe=$(sudo -n -u "$owner" mktemp -d /var/lib/brai/hermes/workspace/brai-ci-speech.XXXXXXXX)
          espeak-ng -v ru -s 135 -w "$work/input.wav" 'Сегодня хорошая погода'
          sudo -n install -m 0600 -o "$owner" -g "$owner" "$work/input.wav" "$probe/input.wav"
          sudo -n systemd-run --wait --collect --quiet --pipe \
             --property="User=$owner" --property="Group=$owner" \
             --property=EnvironmentFile=/etc/brai/hermes/runtime.env \
             --setenv=BRAI_HERMES_CONFIG=/etc/brai/hermes/tools.json \
             --setenv=BRAI_HERMES_OWNER_ID=brai-ci-check \
             /usr/local/bin/node /opt/brai-codeworks/prod-hermes/services/hermes/transcribe.mjs \
             --input "$probe/input.wav" --output "$probe/output.txt" >> "$work/verify.log" 2>&1
          sudo -n -u "$owner" grep -Eiq 'погод' "$probe/output.txt"
          sudo -n -u "$owner" rm -rf -- "$probe"
          printf '%s\n' 'Hermes file transcription through Local AI returned the expected synthetic speech.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() && steps.installer.outcome == 'failure'
        with:
          name: stock-install-failure-encrypted
          path: ${{ runner.temp }}/stock-install-failure.cms
          if-no-files-found: ignore
          retention-days: 1
