# ABOUTME: Classifies the Codex account readiness failure with the same protected test access.
# ABOUTME: Prints fixed reasons only and removes the one-shot credential copy.
name: Stock PROD Codex account probe

on:
  push:
    branches: [feature/stock-prod-clean-20261123]
    paths: [.github/workflows/stock-prod-account-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-prod-clean-install
  cancel-in-progress: false

jobs:
  account:
    if: github.repository == 'Q-Fox-Labs/Brai' && github.ref == 'refs/heads/feature/stock-prod-clean-20261123'
    runs-on: ubuntu-24.04
    environment: stock-prod-clean-install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Q-Fox-Labs/Q-Server
          ssh-key: ${{ secrets.STOCK_PROD_ADMIN_READ_KEY }}
          ref: 06f5ea4c6f970faff7e8c35e655a810a65e05ae5
          persist-credentials: false
      - name: Request account metadata from the pinned Codex binary
        shell: bash
        env:
          INPUT_PART_1: ${{ secrets.STOCK_PROD_INPUT_PART_1 }}
          INPUT_PART_2: ${{ secrets.STOCK_PROD_INPUT_PART_2 }}
          INPUT_PART_3: ${{ secrets.STOCK_PROD_INPUT_PART_3 }}
        run: |
          set -euo pipefail
          umask 077
          probe=$(mktemp -d "$RUNNER_TEMP/stock-codex.XXXXXXXX")
          unit="stock-codex-account-$GITHUB_RUN_ID.service"
          trap 'sudo -n systemctl stop "$unit" 2>/dev/null || true; rm -rf -- "$probe"' EXIT
          mkdir "$probe/home"
          printf '%s' "$INPUT_PART_1$INPUT_PART_2$INPUT_PART_3" | base64 --decode | gzip --decompress > "$probe/inputs.yml"
          unset INPUT_PART_1 INPUT_PART_2 INPUT_PART_3
          python3 -m venv "$probe/python"
          "$probe/python/bin/pip" --disable-pip-version-check install 'PyYAML==6.0.3' 'websockets==16.0' >/dev/null
          curl --fail --location --silent --show-error https://github.com/openai/codex/releases/download/rust-v0.171.0/install.sh -o "$probe/install.sh"
          printf '%s  %s\n' b698d8eb50c0fbe0214ea57b5bf2af439054108404c6d2b872989db02f4bd574 "$probe/install.sh" | sha256sum --check --status
          CODEX_HOME="$probe/home" CODEX_INSTALL_DAEMON_ONLY=1 CODEX_NON_INTERACTIVE=1 \
            /bin/bash "$probe/install.sh" --release 0.171.0 >/dev/null
          "$probe/python/bin/python" -B - "$probe" "$unit" <<'PY'
          import base64, json, os, pwd, subprocess, sys, time
          from pathlib import Path
          from websockets.sync.client import unix_connect
          sys.path.insert(0, 'ansible/roles/fresh_install/files')
          sys.path.insert(0, 'ansible/client/roles/brai_install/files')
          from protected_bundle import loads
          from configure_mcp import configure
          root = Path(sys.argv[1])
          unit = sys.argv[2]
          values = loads((root / 'inputs.yml').read_text())['fresh_install_inputs']
          source = values['files']['/home/agent/.codex/auth.json']['content']
          auth = root / 'home/auth.json'
          auth.write_bytes(base64.b64decode(source, validate=True))
          (root / 'inputs.yml').unlink()
          mcp_input = root / 'mcp.json'
          mcp_input.write_text(json.dumps({'mcp_servers': values.get('mcp_servers', {})}))
          configure(mcp_input, root / 'home/config.toml', pwd.getpwuid(os.getuid()))
          commands = [
              {'id': 1, 'method': 'initialize', 'params': {'clientInfo': {'name': 'brai_agent', 'version': '3.0.0'}, 'capabilities': {'experimentalApi': True}}},
              {'method': 'initialized', 'params': {}},
              {'id': 2, 'method': 'account/read', 'params': {'refreshToken': False}},
          ]
          binary = root / 'home/packages/app-server-daemon/current/bin/codex'
          socket = root / 'home/control.sock'
          subprocess.run(['sudo', '-n', 'systemd-run', '--quiet', '--collect', '--unit', unit,
                          '--property', f'User={pwd.getpwuid(os.getuid()).pw_name}',
                          '--property', f'WorkingDirectory={root}', '--setenv', f'CODEX_HOME={root / "home"}',
                          '--setenv', f'HOME={root}', '--setenv', 'PATH=/usr/local/bin:/usr/bin:/bin',
                          binary, 'app-server', '--listen', 'unix://' + str(socket)], check=True)
          while not socket.is_socket():
              active = subprocess.run(['systemctl', 'is-active', '--quiet', unit]).returncode
              if active:
                  raise SystemExit('CODEX_SYSTEMD_UNIT_UNAVAILABLE')
              time.sleep(.2)
          records = {}
          with unix_connect(str(socket)) as connection:
              for request in commands:
                  connection.send(json.dumps(request))
                  if request.get('id'):
                      while True:
                          reply = json.loads(connection.recv(timeout=20))
                          if reply.get('id') == request['id']:
                              records[request['id']] = reply
                              break
          result = records.get(2, {})
          if result.get('result', {}).get('account'):
              print('CODEX_ACCOUNT_READY')
              sys.exit(0)
          error = result.get('error', {})
          message = error.get('message', '')
          reasons = {
              'workspace routing discovery unauthorized (401)': 'WORKSPACE_UNAUTHORIZED',
              'workspace routing discovery failed': 'WORKSPACE_DISCOVERY_FAILED',
              'workspace routing discovery timed out': 'WORKSPACE_DISCOVERY_TIMEOUT',
              'workspace routing discovery missing backend origin': 'WORKSPACE_ORIGIN_MISSING',
              'workspace routing discovery has invalid account routing override': 'WORKSPACE_OVERRIDE_INVALID',
              'selected workspace missing from routing discovery': 'WORKSPACE_NOT_FOUND',
              'workspace routing requires a ChatGPT account id': 'ACCOUNT_ID_MISSING',
              'failed to load workspace requirements': 'WORKSPACE_REQUIREMENTS_INVALID',
              'refresh token': 'OAUTH_REFRESH_REJECTED',
          }
          reason = next((code for pattern, code in reasons.items() if pattern in message.lower()),
                        'CODEX_ACCOUNT_EMPTY' if 'result' in result else 'CODEX_ACCOUNT_UNKNOWN_ERROR')
          status = error.get('code')
          print(json.dumps({'reason': reason, 'rpcCode': status if type(status) is int else None}))
          sys.exit(1)
          PY
