# ABOUTME: Проверяет описания и инструменты компонентов; полный прогон запускается вручную.
# ABOUTME: Результаты сборки не развёртывают службы и не требуют Codeworks.
name: Components
on:
  push:
    branches: [dev, main, 'feature/**', 'hotfix/**', 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  components:
    name: Components
    runs-on: ubuntu-24.04
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      BRAI_WEB_STANDALONE_OUTPUT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Verify npm toolchain
        run: test "$(npm --version)" = '11.19.1'
      - name: Install the component sandbox
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 restricts capabilities inside unprivileged user namespaces.
          # Admit only bubblewrap, which keeps the test process isolated.
          sudo apparmor_parser -r <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile brai-components-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /usr/bin/true
      - name: Verify component tooling
        run: node --test --test-isolation=none deploy/components/*.test.mjs
      - name: Validate component graph and documentation
        run: node deploy/components/cli.mjs plan
      - name: Prepare dependencies
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm ci --no-audit --no-fund
      - name: Build, check and package active components
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node deploy/components/cli.mjs run
