# ABOUTME: Ограничивает NATS пользователей subjects команд, событий и чтений.
# ABOUTME: Пароли поступают из защищённого окружения; мониторинг не публикуется.
port: 4222
jetstream { store_dir: /data }
authorization {
  users: [
    { user: admin, password: $NATS_ADMIN_PASSWORD },
    { user: web, password: $NATS_WEB_PASSWORD, permissions: {
      publish: { allow: [
        "brai.timer.v1.command.start", "brai.timer.v1.command.stop",
        "brai.timer.v1.query.snapshot", "brai.timer.v1.query.history", "brai.timer.v1.query.command",
        "$JS.API.INFO", "$JS.API.STREAM.INFO.BRAI_TIMER_COMMANDS", "$JS.API.STREAM.INFO.BRAI_TIMER_EVENTS",
        "$JS.API.CONSUMER.CREATE.BRAI_TIMER_EVENTS.web_events", "$JS.API.CONSUMER.CREATE.BRAI_TIMER_EVENTS.web_events.brai.timer.v1.event.*",
        "$JS.API.CONSUMER.DURABLE.CREATE.BRAI_TIMER_EVENTS.web_events", "$JS.API.CONSUMER.INFO.BRAI_TIMER_EVENTS.web_events", "$JS.API.CONSUMER.MSG.NEXT.BRAI_TIMER_EVENTS.web_events",
        "$JS.API.CONSUMER.DELETE.BRAI_TIMER_EVENTS.web_events", "$JS.ACK.BRAI_TIMER_EVENTS.web_events.>",
        "$SRV.PING", "$SRV.INFO", "$SRV.STATS", "$SRV.PING.brai_timer", "$SRV.PING.brai_timer.>", "$SRV.INFO.brai_timer", "$SRV.INFO.brai_timer.>", "$SRV.STATS.brai_timer", "$SRV.STATS.brai_timer.>"
      ] },
      subscribe: { allow: ["_INBOX.brai_web.>", "brai.timer.v1.event.*"] }
    } },
    { user: timer, password: $NATS_TIMER_PASSWORD, permissions: {
      publish: { allow: [
        "brai.timer.v1.event.started", "brai.timer.v1.event.stopped", "brai.timer.v1.event.rejected",
        "$JS.API.INFO", "$JS.API.STREAM.INFO.BRAI_TIMER_COMMANDS", "$JS.API.STREAM.INFO.BRAI_TIMER_EVENTS",
        "$JS.API.STREAM.CREATE.BRAI_TIMER_COMMANDS", "$JS.API.STREAM.CREATE.BRAI_TIMER_EVENTS",
        "$JS.API.STREAM.UPDATE.BRAI_TIMER_COMMANDS", "$JS.API.STREAM.UPDATE.BRAI_TIMER_EVENTS",
        "$JS.API.CONSUMER.CREATE.BRAI_TIMER_COMMANDS.timer_commands", "$JS.API.CONSUMER.CREATE.BRAI_TIMER_COMMANDS.timer_commands.brai.timer.v1.command.*",
        "$JS.API.CONSUMER.DURABLE.CREATE.BRAI_TIMER_COMMANDS.timer_commands",
        "$JS.API.CONSUMER.INFO.BRAI_TIMER_COMMANDS.timer_commands", "$JS.API.CONSUMER.MSG.NEXT.BRAI_TIMER_COMMANDS.timer_commands",
        "$JS.ACK.BRAI_TIMER_COMMANDS.timer_commands.>"
      ] },
      subscribe: { allow: [
        "_INBOX.brai_timer.>", "brai.timer.v1.command.*", "brai.timer.v1.query.*",
        "$SRV.PING", "$SRV.INFO", "$SRV.STATS", "$SRV.PING.brai_timer", "$SRV.PING.brai_timer.>", "$SRV.INFO.brai_timer", "$SRV.INFO.brai_timer.>", "$SRV.STATS.brai_timer", "$SRV.STATS.brai_timer.>"
      ] },
      allow_responses: { max: 1, expires: "30s" }
    } }
  ]
}
