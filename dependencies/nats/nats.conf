# ABOUTME: Ограничивает NATS пользователей subjects команд, событий и чтений.
# ABOUTME: Пароли поступают из защищённого окружения; мониторинг не публикуется.
port: 4222
jetstream { store_dir: /data }
authorization {
  users: [
    { user: admin, password: $NATS_ADMIN_PASSWORD },
    { user: web, password: $NATS_WEB_PASSWORD, permissions: {
      publish: { allow: [
        "brai.auth.v1.send-code", "brai.auth.v1.verify-code", "brai.auth.v1.session", "brai.auth.v1.sign-out",
        "$SRV.PING.brai_auth", "$SRV.PING.brai_auth.>", "$SRV.INFO.brai_auth", "$SRV.INFO.brai_auth.>", "$SRV.STATS.brai_auth", "$SRV.STATS.brai_auth.>",
        "brai.timer.v2.command.start", "brai.timer.v2.command.stop",
        "brai.timer.v2.query.snapshot", "brai.timer.v2.query.history", "brai.timer.v2.query.command",
        "$JS.API.INFO", "$JS.API.STREAM.INFO.BRAI_TIMER_COMMANDS_V2", "$JS.API.STREAM.INFO.BRAI_TIMER_EVENTS_V2",
        "$JS.API.CONSUMER.CREATE.BRAI_TIMER_EVENTS_V2.web_events", "$JS.API.CONSUMER.CREATE.BRAI_TIMER_EVENTS_V2.web_events.brai.timer.v2.event.*",
        "$JS.API.CONSUMER.DURABLE.CREATE.BRAI_TIMER_EVENTS_V2.web_events", "$JS.API.CONSUMER.INFO.BRAI_TIMER_EVENTS_V2.web_events", "$JS.API.CONSUMER.MSG.NEXT.BRAI_TIMER_EVENTS_V2.web_events",
        "$JS.API.CONSUMER.DELETE.BRAI_TIMER_EVENTS_V2.web_events", "$JS.ACK.BRAI_TIMER_EVENTS_V2.web_events.>",
        "$SRV.PING", "$SRV.INFO", "$SRV.STATS", "$SRV.PING.brai_timer", "$SRV.PING.brai_timer.>", "$SRV.INFO.brai_timer", "$SRV.INFO.brai_timer.>", "$SRV.STATS.brai_timer", "$SRV.STATS.brai_timer.>"
      ] },
      subscribe: { allow: ["_INBOX.brai_web.>", "brai.timer.v2.event.*"] }
    } },
    { user: auth, password: $NATS_AUTH_PASSWORD, permissions: {
      publish: { allow: [] },
      subscribe: { allow: [
        "_INBOX.brai_auth.>", "brai.auth.v1.send-code", "brai.auth.v1.verify-code", "brai.auth.v1.session", "brai.auth.v1.sign-out",
        "$SRV.PING", "$SRV.INFO", "$SRV.STATS", "$SRV.PING.brai_auth", "$SRV.PING.brai_auth.>", "$SRV.INFO.brai_auth", "$SRV.INFO.brai_auth.>", "$SRV.STATS.brai_auth", "$SRV.STATS.brai_auth.>"
      ] },
      allow_responses: { max: 1, expires: "30s" }
    } },
    { user: timer, password: $NATS_TIMER_PASSWORD, permissions: {
      publish: { allow: [
        "brai.timer.v2.event.started", "brai.timer.v2.event.stopped", "brai.timer.v2.event.rejected",
        "$JS.API.INFO", "$JS.API.STREAM.INFO.BRAI_TIMER_COMMANDS_V2", "$JS.API.STREAM.INFO.BRAI_TIMER_EVENTS_V2",
        "$JS.API.STREAM.CREATE.BRAI_TIMER_COMMANDS_V2", "$JS.API.STREAM.CREATE.BRAI_TIMER_EVENTS_V2",
        "$JS.API.STREAM.UPDATE.BRAI_TIMER_COMMANDS_V2", "$JS.API.STREAM.UPDATE.BRAI_TIMER_EVENTS_V2",
        "$JS.API.CONSUMER.CREATE.BRAI_TIMER_COMMANDS_V2.timer_commands", "$JS.API.CONSUMER.CREATE.BRAI_TIMER_COMMANDS_V2.timer_commands.brai.timer.v2.command.*",
        "$JS.API.CONSUMER.DURABLE.CREATE.BRAI_TIMER_COMMANDS_V2.timer_commands",
        "$JS.API.CONSUMER.INFO.BRAI_TIMER_COMMANDS_V2.timer_commands", "$JS.API.CONSUMER.MSG.NEXT.BRAI_TIMER_COMMANDS_V2.timer_commands",
        "$JS.ACK.BRAI_TIMER_COMMANDS_V2.timer_commands.>"
      ] },
      subscribe: { allow: [
        "_INBOX.brai_timer.>", "brai.timer.v2.command.*", "brai.timer.v2.query.*",
        "$SRV.PING", "$SRV.INFO", "$SRV.STATS", "$SRV.PING.brai_timer", "$SRV.PING.brai_timer.>", "$SRV.INFO.brai_timer", "$SRV.INFO.brai_timer.>", "$SRV.STATS.brai_timer", "$SRV.STATS.brai_timer.>"
      ] },
      allow_responses: { max: 1, expires: "30s" }
    } }
  ]
}
